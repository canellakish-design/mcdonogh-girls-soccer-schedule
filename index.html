<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>McDonogh Girls Varsity Soccer | Schedule</title>
    <meta name="description" content="McDonogh School Girls Varsity Soccer — training and match schedule." />

    <!-- Home screen icon: YNWA in orange. iOS reads apple-touch-icon,
         Android reads the manifest. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="YNWA" />
    <meta name="application-name" content="YNWA" />
    <meta name="theme-color" content="#141414" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Netlify registers a form only if it can see it in the HTML at deploy
         time, and this app renders after that. This hidden copy is what it
         detects; the real form is src/components/CheckInForm.jsx and posts
         to this name. Field names here must match that component exactly. -->
    <form name="tryout-check-in" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="tryout-check-in" />
      <input type="text" name="bot-field" />
      <input type="text" name="Name" />
      <input type="text" name="Year" />
      <input type="text" name="Years at McDonogh" />
      <input type="text" name="Primary position" />
      <input type="text" name="Secondary position" />
      <input type="email" name="Parent email 1" />
      <input type="email" name="Parent email 2" />
      <input type="text" name="McDonogh email access" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
