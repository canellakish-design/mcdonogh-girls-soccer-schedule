<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>McDonogh Girls Varsity Soccer | Schedule</title>
    <meta name="description" content="McDonogh School Girls Varsity Soccer — training and match schedule." />

    <!-- Home screen icon: YNWA in orange. iOS reads apple-touch-icon,
         Android reads the manifest. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="YNWA" />
    <meta name="application-name" content="YNWA" />
    <meta name="theme-color" content="#141414" />
  </head>
  <body>
    <!-- Netlify reads this static form at build time to register the fields.
         The React form posts to it. It must list every field name, and it is
         hidden from people, not from the crawler — so no `hidden` attribute
         on the form itself, only a wrapper that is display:none. -->
    <div style="display:none" aria-hidden="true">
      <form name="player-profile" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="player-profile" />
        <input type="text" name="bot-field" />
        <input type="text" name="player" />
        <input type="text" name="q1" />
        <input type="text" name="q2" />
        <input type="text" name="q3" />
        <input type="text" name="q4" />
        <input type="text" name="q5" />
        <input type="text" name="q6" />
        <input type="text" name="q7" />
        <input type="text" name="q8" />
        <input type="text" name="q9" />
        <input type="text" name="q10" />
        <input type="text" name="q11" />
        <input type="text" name="q12" />
        <input type="text" name="q13" />
        <input type="text" name="q14" />
        <input type="text" name="q15" />
        <input type="text" name="q16" />
        <input type="text" name="q17" />
        <input type="text" name="q18" />
        <input type="text" name="q19" />
        <input type="text" name="q20" />
        <input type="text" name="q21" />
        <input type="text" name="q22" />
        <input type="text" name="q23" />
        <input type="text" name="q24" />
      </form>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
