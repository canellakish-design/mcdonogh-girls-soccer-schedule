[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never serve the HTML from cache — it is what points at the freshly-hashed
# JS/CSS, and a stale copy pins phones to an old build. Safari in particular
# treats no-cache loosely on a home-screen page. Hashed assets under /assets
# are immutable, so they can still cache long-term.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"
